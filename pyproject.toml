[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "neoubxlogger"
version = "0.1.0"
description = "UBX protocol logger for u-blox GNSS receivers"
license = {text = "BSD-2-Clause"}
requires-python = ">=3.10"
dependencies = [
    "pyubx2",
    "click",
    "rich",
    "pyserial",
    "textual",
]

[project.scripts]
neoubxlogger = "neoubxlogger.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/neoubxlogger"]

[tool.hatch.build.targets.sdist]
include = ["/src"]

[tool.uv.sources]
neoubxlogger = {path = ".", editable = true}